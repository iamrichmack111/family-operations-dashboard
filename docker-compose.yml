services:
  family-dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: family-operations-dashboard

    restart: unless-stopped

    ports:
      - "127.0.0.1:8011:8000"

    environment:
      FAMILY_DASHBOARD_SECRET: "${FAMILY_DASHBOARD_SECRET}"
      FAMILY_DASHBOARD_PORT: "8000"
      FLASK_APP: "wsgi:app"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./instance:/app/instance
      - ./exports:/app/exports
      - ./backups:/app/backups
      - ./uploads:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
