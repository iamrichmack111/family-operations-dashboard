name: Family Operations CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playwright:
    name: Playwright Screenshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Write Playwright config
        run: |
          cat > playwright.config.js <<'JS'
          const { defineConfig } = require('@playwright/test');

          module.exports = defineConfig({
            testDir: './tests',
            timeout: 30000,
            retries: 1,
            use: {
              baseURL: 'http://127.0.0.1:8011',
              headless: true,
              ignoreHTTPSErrors: true,
              viewport: { width: 1440, height: 1000 }
            }
          });
          JS

      - name: Write screenshot test
        run: |
          cat > tests/screenshots.spec.js <<'JS'
          const { test, expect } = require('@playwright/test');

          test('Family Operations screenshots', async ({ page }) => {
            await page.goto('/', { waitUntil: 'networkidle' });
            await expect(page.locator('body')).toBeVisible();

            await page.screenshot({
              path: 'docs/screenshots/01-home.png',
              fullPage: true
            });

            const routes = [
              ['/points', '02-points.png'],
              ['/approvals', '03-approvals.png'],
              ['/requests', '04-requests.png']
            ];

            for (const [route, file] of routes) {
              const response = await page.goto(route, { waitUntil: 'networkidle' }).catch(() => null);
              if (response && response.ok()) {
                await page.screenshot({
                  path: `docs/screenshots/${file}`,
                  fullPage: true
                });
              }
            }
          });
          JS

      - name: Start app
        env:
          SECRET_KEY: ci-secret
          FAMILY_DASHBOARD_SECRET: ci-secret
          PORT: "8011"
          FAMILY_DASHBOARD_PORT: "8011"
        run: |
          if [ -f run.py ]; then
            nohup python run.py >/tmp/family.log 2>&1 &
          elif [ -f app.py ]; then
            nohup python app.py >/tmp/family.log 2>&1 &
          else
            echo "No run.py or app.py found"
            exit 1
          fi

          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8011/ >/dev/null && exit 0
            sleep 1
          done

          cat /tmp/family.log || true
          exit 1

      - name: Run Playwright
        run: |
          rm -rf docs/screenshots/*
          mkdir -p docs/screenshots
          npx playwright test

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-operations-playwright-screenshots
          path: docs/screenshots/
          if-no-files-found: error

      - name: Commit screenshots to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/screenshots

          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "docs: refresh Playwright screenshots [skip ci]"
            git push origin HEAD:main
          fi

  deploy:
    name: Deploy over Tailscale
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets
        id: check
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          FAMILY_TAILNET_HOST: ${{ secrets.FAMILY_TAILNET_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$TS_AUTHKEY" ] && [ -n "$FAMILY_TAILNET_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Tailscale deploy skipped: missing TS_AUTHKEY, FAMILY_TAILNET_HOST, or DEPLOY_SSH_KEY"
          fi

      - name: Join Tailscale
        if: steps.check.outputs.ready == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.FAMILY_TAILNET_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify tailnet connection
        if: steps.check.outputs.ready == 'true'
        run: |
          tailscale status
          tailscale ping -c 3 "${{ secrets.FAMILY_TAILNET_HOST }}"

      - name: Deploy app over Tailscale
        if: steps.check.outputs.ready == 'true'
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude='instance/' \
            --exclude='backups/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='node_modules/' \
            ./ \
            richmack@"${{ secrets.FAMILY_TAILNET_HOST }}":/home/richmack/v46-new/

      - name: Restart remote app and Tailscale Serve
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            richmack@"${{ secrets.FAMILY_TAILNET_HOST }}" '
              sudo -n systemctl restart family-operations 2>/dev/null ||
              pkill -HUP -f "gunicorn.*8011" 2>/dev/null ||
              pkill -HUP -f gunicorn 2>/dev/null ||
              true

              sleep 3
              curl -fsS http://127.0.0.1:8011/ >/dev/null

              sudo -n tailscale serve reset || true
              sudo -n tailscale serve --bg http://127.0.0.1:8011 || true
              tailscale serve status || true
            '

      - name: Skip deploy cleanly
        if: steps.check.outputs.ready != 'true'
        run: echo "Deploy skipped cleanly; Playwright screenshots still succeeded."
