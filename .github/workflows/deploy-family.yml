name: CI/CD Family Operations

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  playwright:
    name: Playwright Screenshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Start Family Operations
        env:
          FAMILY_DASHBOARD_SECRET: playwright-ci-secret
          FAMILY_DASHBOARD_PORT: 8011
        run: |
          nohup python run.py > /tmp/family.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8011/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -f http://127.0.0.1:8011/

      - name: Create screenshots
        run: |
          cat > playwright.config.js <<'JS'
          const { defineConfig } = require('@playwright/test');

          module.exports = defineConfig({
            testDir: './tests',
            timeout: 30000,
            use: {
              baseURL: 'http://127.0.0.1:8011',
              headless: true,
              ignoreHTTPSErrors: true,
              viewport: { width: 1440, height: 1000 }
            }
          });
          JS

          cat > tests/screenshots.spec.js <<'JS'
          const { test } = require('@playwright/test');

          test('Family Operations screenshots', async ({ page }) => {
            await page.goto('/', { waitUntil: 'networkidle' });

            await page.screenshot({
              path: 'docs/screenshots/01-home.png',
              fullPage: true
            });

            const links = [
              ['points', '02-points.png'],
              ['household', '03-household.png'],
              ['planner', '04-planner.png']
            ];

            for (const [name, file] of links) {
              const link = page.getByRole('link', {
                name: new RegExp(name, 'i')
              }).first();

              if (await link.isVisible().catch(() => false)) {
                await link.click();
                await page.waitForLoadState('networkidle');

                await page.screenshot({
                  path: `docs/screenshots/${file}`,
                  fullPage: true
                });

                await page.goto('/');
              }
            }
          });
          JS

          mkdir -p docs/screenshots
          npx playwright test

      - name: Upload Playwright Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-operations-playwright-screenshots
          path: docs/screenshots/
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore


  deploy:
    name: Deploy to family.local
    needs: playwright
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H family.local >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          tailscale ping family.local

          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude='instance/' \
            --exclude='backups/' \
            --exclude='.venv/' \
            --exclude='node_modules/' \
            ./ richmack@family.local:/home/richmack/v46-new/

      - name: Reload Family Operations
        run: |
          ssh -i ~/.ssh/id_ed25519 richmack@family.local '
            sudo systemctl restart family-operations 2>/dev/null ||
            pkill -HUP -f "gunicorn.*8011" 2>/dev/null ||
            true

            sudo tailscale serve reset
            sudo tailscale serve --bg http://127.0.0.1:8011

            sleep 3
            curl -f http://127.0.0.1:8011/
          '
