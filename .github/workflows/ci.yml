name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests run.py wsgi.py

      - name: Run unit tests
        env:
          FAMILY_DASHBOARD_SECRET: ci-only-secret-not-for-production
        run: python -m unittest discover -s tests -v

      - name: Check bundled SQLite database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path('instance/family_dashboard.db')
          if not path.exists():
              raise SystemExit(f'Missing bundled database: {path}')
          with sqlite3.connect(path) as con:
              result = con.execute('PRAGMA integrity_check').fetchone()[0]
          if result != 'ok':
              raise SystemExit(f'SQLite integrity check failed: {result}')
          print('SQLite integrity_check: ok')
          PY

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: family-operations-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
