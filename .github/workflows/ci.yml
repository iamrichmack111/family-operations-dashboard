name: Family Operations CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn Flask-Migrate Pillow pytest

      - name: Compile application
        run: |
          python -m py_compile \
            app/__init__.py \
            app/main.py \
            app/parent.py \
            app/models.py \
            app/services.py \
            app/hq.py \
            wsgi.py

      - name: Verify v67 assets
        run: |
          test -f app/static/v66_command_center.css
          test -f app/static/v66_command_center.js
          grep -q "Grievances" app/templates/base.html
          grep -q "parent.grievances_page" app/templates/base.html

      - name: Run tests
        run: |
          if find . -maxdepth 2 -type f -name 'test_*.py' | grep -q .; then
            pytest -q
          else
            echo "No pytest suite found; compile checks passed."
          fi
