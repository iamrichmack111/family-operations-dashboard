<article id="approval-{{ kind }}-{{ item.id }}" class="task-card status-{{ item.status }}"><div class="d-flex justify-content-between gap-3"><div><h3 class="h6">{{ item.title }}</h3><p class="small text-secondary mb-0">👤 {{ item.assignee.name }} · ⭐ {{ item.points }}</p>{% if kind == 'chore' and item.note %}<p class="small mt-2">📝 {{ item.note }}</p>{% endif %}</div><span class="badge status-badge">{{ item.status|replace('_',' ')|title }}</span></div>{% if item.status=='completed' %}<div class="mt-3"><input form="review-{{ kind }}-{{ item.id }}" name="note" class="form-control form-control-sm dark-field mb-2" placeholder="Approval or redo note"><div class="d-flex flex-wrap gap-2"><form id="review-{{ kind }}-{{ item.id }}" method="post" action="{{ url_for('main.review_task',kind=kind,item_id=item.id) }}" hx-post="{{ url_for('main.review_task',kind=kind,item_id=item.id) }}" hx-target="#approval-{{ kind }}-{{ item.id }}" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button name="status" value="approved" class="btn btn-sm btn-success">✅ Approve</button><button name="status" value="needs_redo" class="btn btn-sm btn-outline-warning">🔁 Needs redo</button><button name="status" value="excused" class="btn btn-sm btn-outline-secondary">🕊️ Excuse</button></form></div></div>{% endif %}</article>
